app = "co-dictator"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/codictator.db"
  CHECK_INTERVAL = "300"
  OLLAMA_ENABLED = "true"
  # OLLAMA_URL set via `fly secrets set OLLAMA_URL=https://...`

[mounts]
  source = "codictator_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[deploy]
  strategy = "immediate"
